spring.application.name=transit-management-system

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/Transit
spring.datasource.username=root
spring.datasource.password=Rahul@777
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Kept true (Spring's default) so lazy @ManyToOne relations (e.g. SalesOrder -> passenger/route/bus)
# can still be serialized to JSON in GET responses without needing a DTO for every entity.
spring.jpa.open-in-view=true

# ---- Server ----
server.port=8080

# ---- Jackson ----
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null
